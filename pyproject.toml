[project]
name = "birdclef-pipeline"
version = "0.1.0"
description = "Local-first BirdCLEF competition pipeline extracted from a notebook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py",
  "librosa",
  "llvmlite==0.45.1",
  "matplotlib",
  "numba==0.62.1",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "pandas",
  "safetensors",
  "scikit-learn",
  "soundfile",
  "timm",
  "torch==2.2.2; sys_platform == 'darwin'",
  "torch==2.2.2+cu121; sys_platform == 'win32' or sys_platform == 'linux'",
  "torchaudio==2.2.2; sys_platform == 'darwin'",
  "torchaudio==2.2.2+cu121; sys_platform == 'win32' or sys_platform == 'linux'",
  "torchvision==0.17.2; sys_platform == 'darwin'",
  "torchvision==0.17.2+cu121; sys_platform == 'win32' or sys_platform == 'linux'",
  "tqdm",
]

[project.scripts]
birdclef = "birdclef.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
